# 검색 앱 전용 명세: 도서(Book)는 범용 명세를 가져다 사용한다
openapi: 3.1.0
info:
  title: 도서 검색 API
  version: 1.0.0
paths:
  /search:
    get:
      operationId: searchBooks
      summary: 도서 검색
      parameters:
        - name: q
          in: query
          required: true
          # 검색어는 1000자까지. 입력창 · Next 서버 · 백엔드가 같은 값으로 막는다 (#86 ②)
          schema:
            type: string
            maxLength: 1000
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 검색 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          description: 검색어가 잘못됨 (1000자 초과)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
components:
  schemas:
    SearchResult:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "../../../packages/api/openapi/common.yaml#/components/schemas/Book"
    ErrorMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
