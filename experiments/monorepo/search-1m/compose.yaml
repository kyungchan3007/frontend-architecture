# frontend-architecture로 옮기며(#88) 폴더 이름이 바뀌어도 예전 DB(도서 100만 건)를 그대로 쓰도록 이름을 고정한다
name: book-search-bench

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: books
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench-local-only
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=200
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db:/db:ro
      - ./data/generated:/generated:ro
    cpus: 2
    mem_limit: 2g
    shm_size: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d books"]
      interval: 2s
      timeout: 3s
      retries: 60

  web:
    build: ./app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bench:bench-local-only@db:5432/books
      NEXT_TELEMETRY_DISABLED: "1"
      DIAG_ENABLED: ${DIAG_ENABLED:-0}
    ports:
      - "127.0.0.1:3000:3000"
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  k6:
    image: grafana/k6:1.0.0
    profiles: ["bench"]
    volumes:
      - ./bench:/bench:ro
      - ./results/raw:/out
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: 2
    mem_limit: 1g

volumes:
  db-data:
